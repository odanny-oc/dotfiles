################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,1920x1080@60,1
monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = sunshine_1, 1920x1080@60, 0x-1080, 1
# monitor = HDMI-A-1, 1920x1080@60, 0x1080, 1
monitor = HDMI-A-1, 2560x1440@59.95, 0x-1440 , 1,

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

workspace = 1, monitor:eDP-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

workspace=1,layoutopt:wslayout-layout:master #workspace id
workspace=2,layoutopt:wslayout-layout:master #workspace id
workspace=3,layoutopt:wslayout-layout:master #workspace id

workspace=4,layoutopt:wslayout-layout:dwindle 

workspace=5,layoutopt:wslayout-layout:master #workspace id
workspace=6,layoutopt:wslayout-layout:master #workspace id
workspace=7,layoutopt:wslayout-layout:master #workspace id
workspace=8,layoutopt:wslayout-layout:master #workspace id
workspace=9,layoutopt:wslayout-layout:master #workspace id
workspace=10,layoutopt:wslayout-layout:master #workspace id
# Example windowrule
# Opacity rules
windowrule = opacity 1 override 1 override 1 override, match:class .*
windowrule = opacity 0.9 0.75, match:class ^(com.mitchellh.ghostty)$

# Floating windows
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, size 400 400, match:class ^(com.vixalien.sticky)$

# Workspace assignment
windowrule = workspace 10, match:class ^(com.vixalien.sticky)$
windowrule = workspace 9, match:class ^(wasistlos)$
windowrule = workspace 2, match:class ^(firefox)$
windowrule = workspace 3, match:class ^(org.mozilla.Thunderbird)$
windowrule = workspace 1, match:class ^(com.github.flxzt.rnote)$
windowrule = workspace 9, match:class ^(Spotify)$
windowrule = workspace 10, match:class ^(python3|Matplotlib|matplotlib)$

# xwaylandvideobridge tweaks
windowrule = opacity 0.0, no_anim on, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus on, match:class ^(xwaylandvideobridge)$
windowrule = max_size 1 1, match:class ^(xwaylandvideobridge)$
windowrule = no_blur on, match:class ^(xwaylandvideobridge)$
windowrule = no_focus on, match:class ^(xwaylandvideobridge)$

# Suppress maximize events globally
windowrule = suppress_event maximize, match:class .*

# Fix dragging issues for XWayland
# windowrule = no_focus on, match:class ^$, title:^$, xwayland:1, float:1, fullscreen:0, pinned:0
