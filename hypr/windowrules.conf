# See https://wiki.hyprland.org/Configuring/Window-Rules/

# '$&' is a hyde specific shorthand for "override" \\ analogous to a reference
# This symbol indicates that the following values will override the default configuration
$&=override

workspace=1,layoutopt:wslayout-layout:master
workspace=2,layoutopt:wslayout-layout:master
workspace=3,layoutopt:wslayout-layout:master
workspace=4,layoutopt:wslayout-layout:master
workspace=5,layoutopt:wslayout-layout:master
workspace=6,layoutopt:wslayout-layout:master
workspace=7,layoutopt:wslayout-layout:master
workspace=8,layoutopt:wslayout-layout:dwindle
workspace=9,layoutopt:wslayout-layout:master
workspace=10,layoutopt:wslayout-layout:master

workspace= 1 , monitor:HDMI-A-1
workspace= 2 , monitor:DP-2
workspace= 3 , override monitor:DP-2
workspace= 8 , monitor:DP-2
workspace= 9 , monitor:HDMI-A-1
workspace= 10 , monitor:HDMI-A-1

windowrule = workspace 1, class:^(cs2)$
windowrule = workspace 2, class:^(discord-stable)$
windowrule = workspace 1, class:^(com.moonlight_stream.Moonlight)$
windowrule = workspace 2, class:^(discord)$
windowrule = workspace 4, class:^(wasistlos)$
windowrule = workspace 3, class:^([Ss]team)$
windowrule = workspace 8, class:^(Matplotlib)$
windowrule = workspace 8, class:^(matplotlib)$
windowrule = workspace 8, class:^(python3)$


# idleinhibit rules
windowrule = idleinhibit fullscreen, class:^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$
windowrule = idleinhibit fullscreen, class:^(.*[Ss]potify.*)$
windowrule = idleinhibit fullscreen, class:^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*Brave.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen.*)$|^(.*vivaldi.*)$

# Picture-in-Picture
windowrule = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = keepaspectratio, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = move 73% 72%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$ 
windowrule = size 25%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = pin, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

