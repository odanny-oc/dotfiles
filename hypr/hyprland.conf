
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf
debug:disable_logs = false
source = ~/.config/hypr/look.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windows.conf
source = ~/.cache/wal/colors-hyprland.conf

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = iio-hyprland
exec-once = kbuildsycoca6
exec-once =  iio-sensor-proxy
# exec-once = ~/.config/hypr/scripts/rotate-screen.sh
exec-once = protonvpn-app
exec-once = blueman-applet
exec-once = xremap --device "UGTABLET UGEE S640 Keyboard" --watch $HOME/.config/xremap/config.yml
# exec-once = ~/.config/hypr/scripts/auto_restart_waybar.sh

bindl = , switch:on:Lid Switch, exec, hyprlock
bindl = , switch:on:Lid Switch, exec, hyprctl dispatch dpms off
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on
# bindl = , switch:on:Lid Switch, exec, pkill ~/.config/hypr/scripts/rotate-screen.sh
# bindl = , switch:off:Lid Switch, exec, hyprctl dispatch ~/.config/hypr/scripts/rotate-screen.sh

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/


# Set programs that you use
$terminal = ghostty
$fileManager = dolphin
$menu = wofi -n --show drun
$browser = firefox
$editor = nvim


#################
### AUTOSTART ###
#################
exec-once = ~/.config/hypr/scripts/mute_on_startup.sh
exec-once = waybar & cb & nm-applet --indicator &
exec-once = swww-daemon
exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE
exec-once = hyprpm reload
exec = hyprshade auto 
exec-once = wvkbd-deskintl --hidden


# Notification Daemon
exec = swaync

render {
    cm_enabled = false
}

# exec = ln -s $XDG_RUNTIME_DIR/hypr /tmp/hypr

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland
env = XDG_MENU_PREFIX,arch-
# env = GSK_RENDERER,gl

exec-once = printf "[D-BUS Service]\nName=org.kde.kded6\nExec=/bin/false" > $HOME/.local/share/dbus-1/services/org.kde.kded6.service

exec-shutdown = rm $HOME/.local/share/dbus-1/services/org.kde.kded6.service

###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
