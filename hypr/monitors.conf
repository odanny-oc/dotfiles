# Set your monitor configuration here
# See https://wiki.hyprland.org/Configuring/Monitors/
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/monitors.t2
monitor= HDMI-A-1,1920x1080@75, 0x0, 1
monitor= DP-2,1920x1080@60, 1920x-450, 1, transform, 3
monitor= DP-1,1920x1080@60, -1920x0, 1
monitor= SUNSHINE,1920x1080@60, 0x1080, 1
# monitor= DP-1,1920x1080@60, 1920x100, 1

workspace= 1 , monitor:HDMI-A-1
workspace= 2 , monitor:DP-2
workspace= 3 , monitor:DP-1
workspace= 4 , monitor:DP-1
workspace= 8 , monitor:DP-2
workspace= 9 , monitor:HDMI-A-1
workspace= 10 ,monitor:HDMI-A-1

exec-once=xrandr --output HDMI-A-1 --primary
