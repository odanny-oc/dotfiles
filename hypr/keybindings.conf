#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    emulate_discrete_scroll = 0
    # accel_profile = flat
    kb_layout = gb, es, gr
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    tablet {
        output = eDP-1
        # region_size = 1870 900
        relative_input = false
    }
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
     touchdevice {
        transform = 0
        output = eDP-1
        enabled = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gesture = 3, horizontal, workspace
# gesture = 3, vertical, exec,-34 $(ps -C wvkbd-deskintl)

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

device {
    name = ydotoold-virtual-device-1
    accel_profile = flat
    kb_layout = uk
    kb_variant =
    kb_options =
    }

$terminal = ghostty
$fileManager = dolphin
$menu = wofi -n --show drun
$browser = firefox
$editor = nvim
$scrPath = ~/.config/hypr/scripts
$iconsPath = $HOME/.config/icons


### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

hyprgrass-bind = , edge:d:u, exec, kill -34 $(ps -C wvkbd-deskintl)
hyprgrass-bindm = , longpress:2, movewindow

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = ,F10, pass, class:^(discord)

bind = Shift Alt, K, exec, $scrPath/keyboardswitch.sh # switch keyboard layout

bind = Control_L, F8, exec, $HOME/.config/xremap/movement_scripts/white.sh
bind = Control_L, F9, exec, $HOME/.config/xremap/movement_scripts/red.sh
bind = Control_L, F10, exec, $HOME/.config/xremap/movement_scripts/yellow.sh

bind = $mainMod, T, exec, $terminal
bind = $mainMod Shift, T, exec, $terminal -e ssh -XC archpcts
bind = $mainMod, G, exec, $scrPath/disable_while_typing.sh
bind = Shift_L&Control_L, Escape,exec, gnome-system-monitor
bind = $mainMod, B, exec, $browser
bind = Control_L Alt, W, exec, wasistlos
bind = Control_L Alt, K, exec, ~/.config/hypr/scripts/wvb_keyboard.sh
bind = $mainMod, Q, killactive,
# bind = $mainMod, M, exit,
bind = Control_L Alt, R, exec, rnote
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Y, exec, Spotify
bind = $mainMod, W, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, A, exec, $menu
bind = $mainMod, R, exec, $scrPath/waybarrs.sh
bind = $mainMod, Up, exec, $scrPath/reset_screen_waybar.sh
bind = $mainMod, Right, exec, $scrPath/rotate_screen_waybar.sh
bind = Control_L Alt, S, exec, $scrPath/sunshine_headless_monitor.sh
bind = Control_L, Return, exec,

# Screenshots
bind = , PRINT, exec, hyprshade off && grimblast copy area && notify-send -i "$iconsPath/screenshot.png" -e "Selected area copied to buffer" && hyprshade auto
# bind = $mainMod Shift, P, exec, hyprshade off && grimblast copy active && notify-send -i "$iconsPath/screenshot.png" -e "Selected window copied to buffer" && hyprshade auto
bind = $mainMod Shift, P, exec, $scrPath/toggle_monitor.sh
bind = $mainMod, P, exec, hyprshade off && grimblast --notify copysave active && hyprshade auto

bind = Control Shift, P, pseudo, # dwindle
bind = $mainMod, V, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
# bind = $mainMod, left, movefocus, l
# bind = $mainMod, right, movefocus, r
# bind = $mainMod, up, movefocus, u
# bind = $mainMod, down, movefocus, d

bind = $mainMod, L, movefocus, l
bind = $mainMod, H, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d


bind = $mainMod Shift, L, resizeactive,30 0
bind = $mainMod Shift, H, resizeactive,-30 0
bind = $mainMod Shift, J, resizeactive,0 30
bind = $mainMod Shift, K, resizeactive,0 -30

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# $moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
# binde = $mainMod Shift Control, left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
# binde = $mainMod Shift Control, right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
# binde = $mainMod Shift Control, up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
# binde = $mainMod Shift Control, down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d


# Laptop multimedia keys for volume and LCD brightness
bindel = $mainMod , F2, exec, ~/.config/hypr/scripts/volume_down.sh

bindel = $mainMod , F3, exec, ~/.config/hypr/scripts/volume_up.sh

bindel = ,XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume_down.sh

bindel = ,XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume_up.sh

bindel = ,XF86AudioMute, exec, ~/.config/hypr/scripts/volume_mute.sh

bindel = $mainMod, F1, exec, ~/.config/hypr/scripts/volume_mute.sh

bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle 


bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness_up.sh

bindel = $mainMod , F5, exec, ~/.config/hypr/scripts/brightness_down.sh

bindel = $mainMod , F6, exec, ~/.config/hypr/scripts/brightness_up.sh

bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness_down.sh

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bindl = , F10, exec, playerctl -i com.github.xeco23.WasIstLos.Sandboxed.instance-7740 previous && notify-send -i "$iconsPath/previous.png" -e -t 1300 " Previous"

bindl = , F11, exec, playerctl -i com.github.xeco23.WasIstLos.Sandboxed.instance-7740 play-pause && notify-send -i "$iconsPath/play_pause.png" -e -t 1300 " Play/Pause"

bindl = , F12, exec, playerctl -i com.github.xeco23.WasIstLos.Sandboxed.instance-7740 next && notify-send -i "$iconsPath/skip.png" -e -t 1300 " Next"
